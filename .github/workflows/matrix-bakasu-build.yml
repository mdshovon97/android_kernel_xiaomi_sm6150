
name: MR MATRIX - Sweet BakaSU Kernel Build

on:
  push:
    branches:
      - matrix-bakasu-test

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-bakasu-first-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Sweet Linux 4.14 with BakaSU
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64

      KERNEL_REPO: mdshovon97/android_kernel_xiaomi_sm6150
      KERNEL_BRANCH: matrix-bakasu-test

      BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9

      CLANG_RELEASE: 06092026
      CLANG_ASSET_ID: "546798216"
      CLANG_SHA256: 531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30

      KERNEL_DIR: kernel

      KBUILD_BUILD_USER: MR_MATRIX
      KBUILD_BUILD_HOST: SWEET_BUILDER

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT KERNEL SOURCE
      # --------------------------------------------------

      - name: Checkout MR MATRIX kernel
        uses: actions/checkout@v4
        with:
          repository: mdshovon97/android_kernel_xiaomi_sm6150
          ref: matrix-bakasu-test
          path: kernel
          fetch-depth: 1

      - name: Record source information
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "Kernel repository: $KERNEL_REPO"
          echo "Kernel branch: $KERNEL_BRANCH"
          echo "Kernel commit: $(git rev-parse HEAD)"

          git log -1 --oneline

      # --------------------------------------------------
      # 2. INSTALL BUILD DEPENDENCIES
      # --------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            python3 \
            perl \
            unzip \
            zstd

          echo "Checking ARM64 linker:"
          command -v aarch64-linux-gnu-ld

          echo "Checking ARM32 compatibility linker:"
          command -v arm-linux-gnueabi-ld

      # --------------------------------------------------
      # 3. DOWNLOAD PINNED NEUTRON CLANG
      # --------------------------------------------------

      - name: Download pinned Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/assets/${CLANG_ASSET_ID}"

          TOOLCHAIN_DIR="$RUNNER_TEMP/toolchain"
          ARCHIVE="$RUNNER_TEMP/neutron-clang.tar.zst"

          mkdir -p "$TOOLCHAIN_DIR"

          echo "Downloading Neutron Clang $CLANG_RELEASE"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_URL" \
            -o "$ARCHIVE"

          echo "Verifying compiler checksum..."

          echo "${CLANG_SHA256}  ${ARCHIVE}" \
            | sha256sum -c -

          echo "Extracting compiler..."

          tar --zstd \
            -xf "$ARCHIVE" \
            -C "$TOOLCHAIN_DIR"

          if [ ! -x "$TOOLCHAIN_DIR/bin/clang" ]; then
            echo "ERROR: Clang executable not found."

            find "$TOOLCHAIN_DIR" \
              -maxdepth 4 \
              -name clang \
              -print

            exit 1
          fi

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version

          echo "PASS: Neutron Clang installed."

      # --------------------------------------------------
      # 4. INTEGRATE PINNED BAKASU
      # --------------------------------------------------

      - name: Integrate pinned BakaSU
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          SETUP_SCRIPT="$RUNNER_TEMP/bakasu-setup.sh"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "$SETUP_SCRIPT"

          echo "Checking setup script syntax..."

          sh -n "$SETUP_SCRIPT"

          echo "Integrating pinned BakaSU..."

          sh "$SETUP_SCRIPT" "$BAKASU_COMMIT"

          test -d KernelSU/.git
          test -L drivers/kernelsu
          test -d drivers/kernelsu

          ACTUAL="$(git -C KernelSU rev-parse HEAD)"

          echo "Expected BakaSU: $BAKASU_COMMIT"
          echo "Actual BakaSU:   $ACTUAL"

          test "$ACTUAL" = "$BAKASU_COMMIT"

          grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo "PASS: Pinned BakaSU integration."

      # --------------------------------------------------
      # 5. GENERATE SWEET CONFIGURATION
      # --------------------------------------------------

      - name: Generate Sweet configuration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p out artifacts

          COMMON_ARGS=(
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "Generating sweet_defconfig..."

          make O=out \
            "${COMMON_ARGS[@]}" \
            sweet_defconfig

          echo "Running olddefconfig..."

          make O=out \
            "${COMMON_ARGS[@]}" \
            olddefconfig

          CONFIG="out/.config"

          test -s "$CONFIG"

          echo "Checking required BakaSU configuration..."

          for OPTION in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_DEBUG_KERNEL
          do
            if ! grep -qx "${OPTION}=y" "$CONFIG"; then
              echo "FAIL: ${OPTION} is not enabled."
              exit 1
            fi

            echo "PASS: ${OPTION}=y"
          done

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "FAIL: Tracepoint hook selected."
            exit 1
          fi

          if grep -qx 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "FAIL: SUSFS selected in Phase 1."
            exit 1
          fi

          cp "$CONFIG" artifacts/generated-sweet.config

          echo "PASS: Sweet configuration generated."

      # --------------------------------------------------
      # 6. OFFICIAL BAKASU MANUAL-HOOK CHECKER
      # --------------------------------------------------

      - name: Verify official BakaSU manual hooks
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          CHECKER="drivers/kernelsu/tools/manual_hook_check.mk"

          CONFIG="$PWD/out/.config"
          CHECK_MK="$RUNNER_TEMP/matrix-check.mk"

          mkdir -p artifacts

          test -f "$CHECKER"
          test -s "$CONFIG"

          KERNEL_VERSION="$(make -s kernelversion)"

          VERSION_MAJOR="${KERNEL_VERSION%%.*}"

          VERSION_REST="${KERNEL_VERSION#*.}"
          VERSION_MINOR="${VERSION_REST%%.*}"

          echo "Kernel version: $KERNEL_VERSION"

          cat > "$CHECK_MK" <<'EOF'
          include $(KSU_CONFIG_FILE)
          include $(KSU_CHECKER_FILE)

          .DEFAULT_GOAL := check

          .PHONY: check
          check:
          	@echo "PASS: Official BakaSU manual-hook checker"
          EOF

          set -o pipefail

          make --no-print-directory \
            -f "$CHECK_MK" \
            srctree="$PWD" \
            VERSION="$VERSION_MAJOR" \
            PATCHLEVEL="$VERSION_MINOR" \
            REPO_NAME="BakaSU" \
            KSU_CONFIG_FILE="$CONFIG" \
            KSU_CHECKER_FILE="$PWD/$CHECKER" \
            check \
            2>&1 | tee artifacts/manual-hook-check.log

          echo "PASS: BakaSU manual-hook validation."

      # --------------------------------------------------
      # 7. VERIFY TOOLCHAIN SELECTION
      # --------------------------------------------------

      - name: Verify ARM64 and ARM32 toolchains
        shell: bash
        run: |
          set -euo pipefail

          echo "Clang:"
          command -v clang
          clang --version

          echo "ARM64 linker:"
          command -v aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version

          echo "ARM32 compatibility linker:"
          command -v arm-linux-gnueabi-ld
          arm-linux-gnueabi-ld --version

          echo "PASS: Required toolchains available."

      # --------------------------------------------------
      # 8. COMPILE SWEET KERNEL
      # --------------------------------------------------

      - name: Compile Sweet kernel
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p artifacts

          MAKE_ARGS=(
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "Kernel version:"
          make -s kernelversion

          echo "Compiler:"
          clang --version

          echo "ARM64 linker:"
          aarch64-linux-gnu-ld --version

          echo "ARM32 compatibility linker:"
          arm-linux-gnueabi-ld --version

          echo "Starting Sweet ARM64 compilation..."

          set -o pipefail

          make -j"$(nproc)" \
            O=out \
            "${MAKE_ARGS[@]}" \
            Image.gz dtbs \
            2>&1 | tee artifacts/build.log

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -s "$IMAGE" ]; then
            echo "FAIL: Image.gz was not generated."
            exit 1
          fi

          cp "$IMAGE" artifacts/Image.gz

          if [ -d out/arch/arm64/boot/dts ]; then
            tar -czf artifacts/dtb-output.tar.gz \
              -C out/arch/arm64/boot dts
          fi

          echo "PASS: Sweet kernel image generated."

      # --------------------------------------------------
      # 9. RECORD BUILD INFORMATION
      # --------------------------------------------------

      - name: Record build information
        if: always()
        shell: bash
        working-directory: kernel
        run: |
          mkdir -p artifacts

          {
            echo "MR MATRIX - Sweet BakaSU Build"

            echo "Kernel repository: $KERNEL_REPO"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "BakaSU commit: $BAKASU_COMMIT"

            echo "Clang release: $CLANG_RELEASE"
            echo "Kernel version: $(make -s kernelversion || true)"

            echo
            echo "Configuration:"

            if [ -s out/.config ]; then
              grep -E \
                '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_DEBUG_KERNEL=)' \
                out/.config || true
            else
              echo "Configuration not generated."
            fi

            echo
            echo "Build result: ${{ job.status }}"

          } > artifacts/build-info.txt

      # --------------------------------------------------
      # 10. UPLOAD BUILD ARTIFACTS
      # --------------------------------------------------

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-Sweet-BakaSU-Compile
          path: |
            kernel/artifacts/
          if-no-files-found: warn
          retention-days: 14
