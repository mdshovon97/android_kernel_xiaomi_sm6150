
name: MR MATRIX - Sweet BakaSU DroidSpace Kernel Build

on:
  workflow_dispatch:

  push:
    branches:
      - matrix-droidspace-config
    paths:
      - "arch/arm64/configs/sweet_defconfig"
      - "drivers/**"
      - "kernel/**"
      - "fs/**"
      - "net/**"
      - "security/**"
      - "include/**"
      - ".github/workflows/matrix-droidspace-kernel-build.yml"

permissions:
  contents: read

concurrency:
  group: matrix-droidspace-sweet-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Sweet BakaSU + DroidSpace
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64

      KERNEL_BRANCH: matrix-droidspace-config

      BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9

      CLANG_RELEASE: "06092026"
      CLANG_ASSET_ID: "546798216"
      CLANG_SHA256: "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30"

      ANYKERNEL_REPO: https://github.com/riarumoda/AnyKernel3.git
      ANYKERNEL_COMMIT: e1b0dc4ef8606c70b29a4ef33459404af3d9d71d

      KBUILD_BUILD_USER: MR_MATRIX
      KBUILD_BUILD_HOST: SWEET_DROIDSPACE

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT KERNEL SOURCE
      # --------------------------------------------------

      - name: Checkout MR MATRIX kernel
        uses: actions/checkout@v4
        with:
          ref: matrix-droidspace-config
          fetch-depth: 1

      - name: Record source information
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "MR MATRIX SWEET DROIDSPACE BUILD"
          echo "Branch: $KERNEL_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Kernel: $(make -s kernelversion)"

          git log -1 --format=fuller \
            > artifacts/source-commit.txt

          git rev-parse HEAD \
            > artifacts/source-sha.txt

          echo "$KERNEL_BRANCH" \
            > artifacts/source-branch.txt

          make -s kernelversion \
            > artifacts/kernel-version.txt

      # --------------------------------------------------
      # 2. INSTALL BUILD DEPENDENCIES
      # --------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            jq \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            make \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip \
            zstd

          command -v aarch64-linux-gnu-ld
          command -v arm-linux-gnueabi-ld

          echo "PASS: Build dependencies installed."

      # --------------------------------------------------
      # 3. DOWNLOAD PINNED NEUTRON CLANG
      # --------------------------------------------------

      - name: Download pinned Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/assets/${CLANG_ASSET_ID}"

          TOOLCHAIN_DIR="$RUNNER_TEMP/neutron-clang"
          ARCHIVE="$RUNNER_TEMP/neutron-clang.tar.zst"

          mkdir -p "$TOOLCHAIN_DIR" artifacts

          echo "Downloading Neutron Clang ${CLANG_RELEASE}"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_URL" \
            -o "$ARCHIVE"

          echo "Verifying SHA256..."

          echo "${CLANG_SHA256}  ${ARCHIVE}" \
            | sha256sum -c -

          zstd -t "$ARCHIVE"

          echo "Extracting toolchain..."

          tar --zstd \
            -xf "$ARCHIVE" \
            -C "$TOOLCHAIN_DIR"

          CLANG_BIN="$TOOLCHAIN_DIR/bin"

          REQUIRED_TOOLS=(
            clang
            clang++
            ld.lld
            llvm-ar
            llvm-nm
            llvm-objcopy
            llvm-objdump
            llvm-readelf
            llvm-strip
          )

          for TOOL in "${REQUIRED_TOOLS[@]}"; do
            if [ ! -x "$CLANG_BIN/$TOOL" ]; then
              echo "ERROR: Missing tool: $TOOL"
              exit 1
            fi
            echo "PASS: $TOOL"
          done

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "$CLANG_RELEASE" \
            > artifacts/clang-release.txt

          "$CLANG_BIN/clang" --version \
            | tee artifacts/clang-version.txt

          "$CLANG_BIN/ld.lld" --version

          echo "PASS: Pinned Neutron Clang verified."

      # --------------------------------------------------
      # 4. INTEGRATE PINNED BAKASU
      # --------------------------------------------------

      - name: Integrate pinned BakaSU
        shell: bash
        run: |
          set -euo pipefail

          SETUP_SCRIPT="$RUNNER_TEMP/bakasu-setup.sh"

          echo "Downloading pinned BakaSU setup script..."

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "$SETUP_SCRIPT"

          sh -n "$SETUP_SCRIPT"

          echo "Integrating BakaSU: $BAKASU_COMMIT"

          sh "$SETUP_SCRIPT" "$BAKASU_COMMIT"

          test -d KernelSU/.git

          ACTUAL_COMMIT="$(git -C KernelSU rev-parse HEAD)"

          echo "Expected: $BAKASU_COMMIT"
          echo "Actual:   $ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$BAKASU_COMMIT"

          test -L drivers/kernelsu
          test -d drivers/kernelsu

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/tools/manual_hook_check.mk

          echo "PASS: BakaSU integration verified."

      # --------------------------------------------------
      # 5. VERIFY BAKASU REGISTRATION
      # --------------------------------------------------

      - name: Verify BakaSU Kconfig and Makefile
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          KCONFIG_COUNT="$(
            grep -Fc \
              'source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig
          )"

          MAKEFILE_COUNT="$(
            grep -Fc \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              drivers/Makefile
          )"

          test "$KCONFIG_COUNT" -eq 1
          test "$MAKEFILE_COUNT" -eq 1

          echo "PASS: Unique BakaSU registration."

      # --------------------------------------------------
      # 6. GENERATE SWEET CONFIGURATION
      # --------------------------------------------------

      - name: Generate Sweet configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out artifacts

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            LD=ld.lld
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "Generating sweet_defconfig..."

          make O=out \
            "${MAKE_ARGS[@]}" \
            sweet_defconfig

          echo "Resolving Kconfig..."

          make O=out \
            "${MAKE_ARGS[@]}" \
            olddefconfig

          CONFIG="out/.config"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: Configuration missing."
            exit 1
          fi

          cp "$CONFIG" \
            artifacts/generated-sweet.config

          echo "PASS: Sweet configuration generated."

      # --------------------------------------------------
      # 7. VERIFY BAKASU AND DROIDSPACE
      # --------------------------------------------------

      - name: Verify BakaSU and DroidSpace configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          test -s "$CONFIG"

          FAILED=0

          REQUIRED=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK

            CONFIG_SYSCTL
            CONFIG_SYSVIPC
            CONFIG_POSIX_MQUEUE

            CONFIG_NAMESPACES
            CONFIG_PID_NS
            CONFIG_UTS_NS
            CONFIG_IPC_NS
            CONFIG_USER_NS
            CONFIG_NET_NS

            CONFIG_SECCOMP
            CONFIG_SECCOMP_FILTER

            CONFIG_CGROUPS
            CONFIG_CGROUP_DEVICE
            CONFIG_CGROUP_SCHED
            CONFIG_FAIR_GROUP_SCHED
            CONFIG_CGROUP_FREEZER
            CONFIG_CGROUP_NET_PRIO
            CONFIG_MEMCG
            CONFIG_MEMCG_SWAP
            CONFIG_CGROUP_PIDS
            CONFIG_CGROUP_CPUACCT

            CONFIG_DEVTMPFS
            CONFIG_OVERLAY_FS
            CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR

            CONFIG_FW_LOADER
            CONFIG_FW_LOADER_USER_HELPER

            CONFIG_VETH
            CONFIG_BRIDGE
            CONFIG_BRIDGE_NETFILTER
            CONFIG_NETFILTER
            CONFIG_NETFILTER_ADVANCED
            CONFIG_NF_CONNTRACK
            CONFIG_NF_CT_NETLINK

            CONFIG_IP_NF_IPTABLES
            CONFIG_IP_NF_FILTER
            CONFIG_NF_NAT
            CONFIG_IP_NF_NAT
            CONFIG_IP_NF_TARGET_MASQUERADE
            CONFIG_NF_CONNTRACK_IPV4
            CONFIG_NF_NAT_IPV4

            CONFIG_IPV6
            CONFIG_IPV6_MULTIPLE_TABLES
            CONFIG_IP6_NF_IPTABLES
            CONFIG_IP6_NF_FILTER
            CONFIG_IP6_NF_MANGLE
            CONFIG_IP6_NF_NAT
            CONFIG_NF_CONNTRACK_IPV6
            CONFIG_IP6_NF_TARGET_MASQUERADE

            CONFIG_MACVLAN
            CONFIG_BLK_DEV_LOOP
            CONFIG_EXT4_FS
            CONFIG_FUSE_FS
            CONFIG_TUN
          )

          echo "Checking mandatory options..."

          for SYMBOL in "${REQUIRED[@]}"; do
            if grep -qx "${SYMBOL}=y" "$CONFIG"; then
              echo "PASS: ${SYMBOL}=y"
            else
              echo "FAIL: ${SYMBOL}"
              FAILED=1
            fi
          done

          echo
          echo "Checking BakaSU hook selection..."

          if grep -qx \
            'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "FAIL: Tracepoint hook selected."
            FAILED=1
          else
            echo "PASS: Manual hook selection."
          fi

          echo
          echo "Checking CFS bandwidth..."

          if grep -qx 'CONFIG_CFS_BANDWIDTH=y' "$CONFIG"; then
            echo "FAIL: CFS bandwidth unexpectedly enabled."
            FAILED=1
          else
            echo "PASS: CFS bandwidth disabled."
          fi

          echo
          echo "Resolved configuration:"

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_USER_NS=|CONFIG_PID_NS=|CONFIG_IPC_NS=|CONFIG_NET_NS=|CONFIG_SECCOMP=|CONFIG_SECCOMP_FILTER=|CONFIG_CGROUPS=|CONFIG_CGROUP_SCHED=|CONFIG_FAIR_GROUP_SCHED=|CONFIG_CFS_BANDWIDTH=|CONFIG_OVERLAY_FS=|CONFIG_SCHED_WALT=)' \
            "$CONFIG" || true

          echo
          echo "IPv6 NAT configuration:"

          grep -E \
            '^(CONFIG_IP6_NF_NAT=|CONFIG_IP6_NF_TARGET_MASQUERADE=|CONFIG_NF_NAT_IPV6=|CONFIG_NF_CONNTRACK_IPV6=)' \
            "$CONFIG" || true

          cp "$CONFIG" \
            artifacts/sweet-droidspace-resolved.config

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Configuration validation failed."
            exit 1
          fi

          echo "PASS: BakaSU and DroidSpace configuration."

      # --------------------------------------------------
      # 8. VERIFY OFFICIAL BAKASU MANUAL HOOKS
      # --------------------------------------------------

      - name: Verify BakaSU manual hooks
        shell: bash
        run: |
          set -euo pipefail

          CHECKER="drivers/kernelsu/tools/manual_hook_check.mk"

          CONFIG="$PWD/out/.config"
          CHECK_MK="$RUNNER_TEMP/matrix-check.mk"

          mkdir -p artifacts

          test -f "$CHECKER"
          test -s "$CONFIG"

          KERNEL_VERSION="$(make -s kernelversion)"

          VERSION_MAJOR="${KERNEL_VERSION%%.*}"
          VERSION_REST="${KERNEL_VERSION#*.}"
          VERSION_MINOR="${VERSION_REST%%.*}"

          echo "Kernel version: $KERNEL_VERSION"

          cat > "$CHECK_MK" <<'EOF'
          include $(KSU_CONFIG_FILE)
          include $(KSU_CHECKER_FILE)

          .DEFAULT_GOAL := check

          .PHONY: check
          check:
          	@echo "PASS: Official BakaSU manual-hook checker"
          EOF

          set -o pipefail

          make --no-print-directory \
            -f "$CHECK_MK" \
            srctree="$PWD" \
            VERSION="$VERSION_MAJOR" \
            PATCHLEVEL="$VERSION_MINOR" \
            REPO_NAME="BakaSU" \
            KSU_CONFIG_FILE="$CONFIG" \
            KSU_CHECKER_FILE="$PWD/$CHECKER" \
            check \
            2>&1 | tee artifacts/manual-hook-check.log

          echo "PASS: BakaSU manual-hook validation."

      # --------------------------------------------------
      # 9. VERIFY BUILD TOOLCHAINS
      # --------------------------------------------------

      - name: Verify compiler and cross-compilers
        shell: bash
        run: |
          set -euo pipefail

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          command -v aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version

          command -v arm-linux-gnueabi-ld
          arm-linux-gnueabi-ld --version

          echo "PASS: Build toolchains verified."

      # --------------------------------------------------
      # 10. COMPILE SWEET KERNEL AND DEVICE TREES
      # --------------------------------------------------

      - name: Compile Sweet kernel and DTBs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/kernel-output

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            LD=ld.lld
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          JOBS="$(nproc)"

          echo "======================================"
          echo "MR MATRIX SWEET KERNEL BUILD"
          echo "======================================"

          echo "Kernel: $(make -s kernelversion)"
          echo "Device: Sweet / Sweetin"
          echo "Architecture: ARM64"
          echo "Compiler: Neutron Clang"
          echo "Build jobs: $JOBS"

          set -o pipefail

          make -j"$JOBS" \
            O=out \
            "${MAKE_ARGS[@]}" \
            Image.gz dtbs \
            2>&1 | tee artifacts/build.log

          IMAGE="out/arch/arm64/boot/Image.gz"
          BOOT_DIR="out/arch/arm64/boot"
          QCOM_DTS="$BOOT_DIR/dts/qcom"

          test -s "$IMAGE"

          cp "$IMAGE" \
            artifacts/kernel-output/Image.gz

          echo "Checking Sweet device-tree outputs..."

          DTB="$QCOM_DTS/xiaomi-sdmmagpie.dtb"
          DTBO="$QCOM_DTS/sweet-sdmmagpie-overlay.dtbo"

          test -s "$DTB"
          test -s "$DTBO"

          cp "$DTB" \
            artifacts/kernel-output/xiaomi-sdmmagpie.dtb

          cp "$DTBO" \
            artifacts/kernel-output/sweet-sdmmagpie-overlay.dtbo

          if [ -s "$BOOT_DIR/dtb.img" ]; then
            cp "$BOOT_DIR/dtb.img" \
              artifacts/kernel-output/
          fi

          if [ -s "$BOOT_DIR/dtbo.img" ]; then
            cp "$BOOT_DIR/dtbo.img" \
              artifacts/kernel-output/
          fi

          find "$BOOT_DIR/dts" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print \
            > artifacts/kernel-output/device-tree-files.txt

          tar -czf \
            artifacts/kernel-output/dts.tar.gz \
            -C "$BOOT_DIR" dts

          sha256sum \
            artifacts/kernel-output/Image.gz \
            artifacts/kernel-output/xiaomi-sdmmagpie.dtb \
            artifacts/kernel-output/sweet-sdmmagpie-overlay.dtbo \
            > artifacts/kernel-output/kernel-output.sha256

          echo "PASS: Kernel and device-tree compilation."

          ls -lh artifacts/kernel-output/

      # --------------------------------------------------
      # 11. PREPARE PINNED ANYKERNEL3
      # --------------------------------------------------

      - name: Prepare MR MATRIX AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          AK3_DIR="$RUNNER_TEMP/AnyKernel3"

          echo "Cloning pinned AnyKernel3..."

          git init "$AK3_DIR"

          git -C "$AK3_DIR" remote add origin "$ANYKERNEL_REPO"

          git -C "$AK3_DIR" fetch \
            --depth=1 \
            origin "$ANYKERNEL_COMMIT"

          git -C "$AK3_DIR" checkout \
            --detach FETCH_HEAD

          ACTUAL_AK3_COMMIT="$(
            git -C "$AK3_DIR" rev-parse HEAD
          )"

          echo "Expected: $ANYKERNEL_COMMIT"
          echo "Actual:   $ACTUAL_AK3_COMMIT"

          test "$ACTUAL_AK3_COMMIT" = "$ANYKERNEL_COMMIT"

          test -s "$AK3_DIR/anykernel.sh"
          test -s "$AK3_DIR/tools/ak3-core.sh"
          test -s "$AK3_DIR/META-INF/com/google/android/update-binary"

          echo "Checking Sweet device support..."

          grep -Fq 'device.name1=sweet' \
            "$AK3_DIR/anykernel.sh"

          grep -Fq 'device.name2=sweetin' \
            "$AK3_DIR/anykernel.sh"

          echo "Checking Android 17 compatibility..."

          python3 - "$AK3_DIR/anykernel.sh" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = r"(?m)^supported\.versions=.*$"

          matches = re.findall(pattern, text)

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one supported.versions entry."
              )

          text = re.sub(
              pattern,
              "supported.versions=17",
              text
          )

          path.write_text(text)

          if "supported.versions=17" not in text:
              raise SystemExit(
                  "ERROR: Android 17 version update failed."
              )

          print("PASS: Android 17 installer compatibility configured.")
          PY

          grep -Fq 'supported.versions=17' \
            "$AK3_DIR/anykernel.sh"

          echo "$AK3_DIR" \
            > artifacts/anykernel-directory.txt

          echo "$ACTUAL_AK3_COMMIT" \
            > artifacts/anykernel-commit.txt

          echo "PASS: Pinned AnyKernel3 prepared."

      # --------------------------------------------------
      # 12. STAGE KERNEL AND DEVICE TREES
      # --------------------------------------------------

      - name: Stage Sweet kernel DTB and DTBO
        shell: bash
        run: |
          set -euo pipefail

          AK3_DIR="$RUNNER_TEMP/AnyKernel3"
          OUTPUT="artifacts/kernel-output"

          test -s "$OUTPUT/Image.gz"
          test -s "$OUTPUT/xiaomi-sdmmagpie.dtb"
          test -s "$OUTPUT/sweet-sdmmagpie-overlay.dtbo"

          echo "Staging kernel image..."

          cp "$OUTPUT/Image.gz" \
            "$AK3_DIR/Image.gz"

          echo "Staging compiled DTB..."

          cp "$OUTPUT/xiaomi-sdmmagpie.dtb" \
            "$AK3_DIR/dtb"

          echo "Staging compiled DTBO..."

          cp "$OUTPUT/sweet-sdmmagpie-overlay.dtbo" \
            "$AK3_DIR/dtbo"

          echo "Checking AnyKernel3 staged files..."

          test -s "$AK3_DIR/Image.gz"
          test -s "$AK3_DIR/dtb"
          test -s "$AK3_DIR/dtbo"

          sha256sum \
            "$AK3_DIR/Image.gz" \
            "$AK3_DIR/dtb" \
            "$AK3_DIR/dtbo" \
            > artifacts/anykernel-staged-sha256.txt

          echo "PASS: Kernel, DTB and DTBO staged."

          ls -lh \
            "$AK3_DIR/Image.gz" \
            "$AK3_DIR/dtb" \
            "$AK3_DIR/dtbo"

      # --------------------------------------------------
      # 13. VERIFY ANYKERNEL3 INSTALLER
      # --------------------------------------------------

      - name: Verify AnyKernel3 installer
        shell: bash
        run: |
          set -euo pipefail

          AK3_DIR="$RUNNER_TEMP/AnyKernel3"

          echo "Checking installer configuration..."

          grep -Fq 'device.name1=sweet' \
            "$AK3_DIR/anykernel.sh"

          grep -Fq 'device.name2=sweetin' \
            "$AK3_DIR/anykernel.sh"

          grep -Fq 'supported.versions=17' \
            "$AK3_DIR/anykernel.sh"

          grep -Fq 'BLOCK=/dev/block/bootdevice/by-name/boot' \
            "$AK3_DIR/anykernel.sh"

          echo "Checking staged payload..."

          test -s "$AK3_DIR/Image.gz"
          test -s "$AK3_DIR/dtb"
          test -s "$AK3_DIR/dtbo"

          echo "Checking AnyKernel3 DTBO flashing support..."

          grep -Fq 'flash_generic dtbo' \
            "$AK3_DIR/tools/ak3-core.sh"

          echo "Checking installer files..."

          test -s "$AK3_DIR/META-INF/com/google/android/update-binary"
          test -s "$AK3_DIR/META-INF/com/google/android/updater-script"

          echo "PASS: AnyKernel3 installer checks."

      # --------------------------------------------------
      # 14. PACKAGE TEST ZIP
      # --------------------------------------------------

      - name: Package MR MATRIX test ZIP
        shell: bash
        run: |
          set -euo pipefail

          AK3_DIR="$RUNNER_TEMP/AnyKernel3"

          ZIP_NAME="MR-MATRIX-BakaSU-Sweet-DroidSpace-TEST.zip"

          cd "$AK3_DIR"

          zip -rq9 "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder*"

          cd "$GITHUB_WORKSPACE"

          test -s "$ZIP_NAME"

          echo "Testing flashable ZIP..."

          unzip -t "$ZIP_NAME" \
            > artifacts/anykernel-zip-validation.txt

          unzip -l "$ZIP_NAME" \
            > artifacts/anykernel-contents.txt

          echo "Verifying ZIP payload..."

          unzip -Z1 "$ZIP_NAME" | grep -Fxq 'Image.gz'
          unzip -Z1 "$ZIP_NAME" | grep -Fxq 'dtb'
          unzip -Z1 "$ZIP_NAME" | grep -Fxq 'dtbo'
          unzip -Z1 "$ZIP_NAME" | grep -Fxq 'anykernel.sh'

          sha256sum "$ZIP_NAME" \
            > artifacts/anykernel-sha256.txt

          echo "PASS: Flashable test ZIP packaged."

          ls -lh "$ZIP_NAME"

      # --------------------------------------------------
      # 15. VERIFY FINAL PACKAGE
      # --------------------------------------------------

      - name: Final package verification
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="MR-MATRIX-BakaSU-Sweet-DroidSpace-TEST.zip"

          EXPECTED_IMAGE="artifacts/kernel-output/Image.gz"
          EXPECTED_DTB="artifacts/kernel-output/xiaomi-sdmmagpie.dtb"
          EXPECTED_DTBO="artifacts/kernel-output/sweet-sdmmagpie-overlay.dtbo"

          TMP="$RUNNER_TEMP/package-verification"

          mkdir -p "$TMP"

          unzip -q "$ZIP_NAME" -d "$TMP"

          echo "Comparing packaged kernel..."

          cmp "$EXPECTED_IMAGE" "$TMP/Image.gz"

          echo "Comparing packaged DTB..."

          cmp "$EXPECTED_DTB" "$TMP/dtb"

          echo "Comparing packaged DTBO..."

          cmp "$EXPECTED_DTBO" "$TMP/dtbo"

          echo "Verifying Android 17 installer..."

          grep -Fq 'supported.versions=17' \
            "$TMP/anykernel.sh"

          echo "PASS: Final package payload verified."

      # --------------------------------------------------
      # 16. RECORD BUILD INFORMATION
      # --------------------------------------------------

      - name: Record build information
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts

          {
            echo "MR MATRIX - Sweet BakaSU DroidSpace"
            echo
            echo "Branch: $KERNEL_BRANCH"
            echo "Commit: $(git rev-parse HEAD 2>/dev/null)"
            echo "Kernel: $(make -s kernelversion 2>/dev/null)"
            echo
            echo "BakaSU commit: $BAKASU_COMMIT"
            echo "Neutron Clang: $CLANG_RELEASE"
            echo "AnyKernel3 commit: $ANYKERNEL_COMMIT"

            echo
            echo "BakaSU configuration:"

            if [ -s out/.config ]; then
              grep -E \
                '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_TRACEPOINT_HOOK=)' \
                out/.config || true
            else
              echo "Configuration not generated."
            fi

            echo
            echo "DroidSpace configuration:"

            if [ -s out/.config ]; then
              grep -E \
                '^(CONFIG_USER_NS=|CONFIG_PID_NS=|CONFIG_IPC_NS=|CONFIG_NET_NS=|CONFIG_SECCOMP=|CONFIG_SECCOMP_FILTER=|CONFIG_CGROUPS=|CONFIG_CGROUP_SCHED=|CONFIG_CFS_BANDWIDTH=|CONFIG_OVERLAY_FS=|CONFIG_SCHED_WALT=)' \
                out/.config || true
            fi

            echo
            echo "Device tree outputs:"

            ls -lh artifacts/kernel-output/ 2>/dev/null || true

            echo
            echo "Build result: ${{ job.status }}"

          } > artifacts/build-info.txt

      # --------------------------------------------------
      # 17. UPLOAD BUILD ARTIFACTS
      # --------------------------------------------------

      - name: Upload MR MATRIX kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-Sweet-BakaSU-DroidSpace-TEST
          path: |
            artifacts/
            MR-MATRIX-BakaSU-Sweet-DroidSpace-TEST.zip
          if-no-files-found: warn
          retention-days: 14
