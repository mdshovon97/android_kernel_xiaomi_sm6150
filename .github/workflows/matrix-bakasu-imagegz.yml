
name: MR MATRIX - Sweet DroidSpaces BakaSU Image.gz Build

on:
  workflow_dispatch:

  push:
    branches:
      - matrix-droidspace-bakasu
    paths:
      - '.github/workflows/matrix-bakasu-imagegz.yml'
      - 'arch/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'init/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'security/**'
      - 'scripts/**'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: matrix-droidspace-bakasu-imagegz
  cancel-in-progress: false

jobs:
  build:
    name: Build Sweet Image.gz - BakaSU + DroidSpaces Stage 1 & 2
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64

      KERNEL_REPO: mdshovon97/android_kernel_xiaomi_sm6150
      KERNEL_BRANCH: matrix-droidspace-bakasu

      BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9

      CLANG_RELEASE: 06092026
      CLANG_ASSET_ID: "546798216"
      CLANG_SHA256: ""

      KBUILD_BUILD_USER: MR_MATRIX
      KBUILD_BUILD_HOST: SWEET_BUILDER

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT TARGET BRANCH
      # --------------------------------------------------

      - name: Checkout matrix-droidspace-bakasu
        uses: actions/checkout@v4
        with:
          repository: mdshovon97/android_kernel_xiaomi_sm6150
          ref: matrix-droidspace-bakasu
          path: kernel
          fetch-depth: 1

      - name: Record source information
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "Repository: $KERNEL_REPO"
          echo "Expected branch: $KERNEL_BRANCH"
          echo "Actual commit: $(git rev-parse HEAD)"

          git log -1 --oneline | tee artifacts/source-commit.txt

      # --------------------------------------------------
      # 2. INSTALL BUILD DEPENDENCIES
      # --------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            python3 \
            perl \
            unzip \
            zstd

          echo "ARM64 linker:"
          command -v aarch64-linux-gnu-ld

          echo "ARM32 compatibility linker:"
          command -v arm-linux-gnueabi-ld

      # --------------------------------------------------
      # 3. DOWNLOAD AND VALIDATE PINNED NEUTRON CLANG
      # --------------------------------------------------

      - name: Download pinned Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          ASSET_API="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/assets/${CLANG_ASSET_ID}"

          ASSET_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${CLANG_RELEASE}/neutron-clang-${CLANG_RELEASE}.tar.zst"

          TOOLCHAIN_DIR="$RUNNER_TEMP/toolchain"
          ARCHIVE="$RUNNER_TEMP/neutron-clang-${CLANG_RELEASE}.tar.zst"
          METADATA="$RUNNER_TEMP/neutron-clang-asset.json"

          mkdir -p "$TOOLCHAIN_DIR"

          echo "Neutron Clang release: $CLANG_RELEASE"
          echo "Asset ID: $CLANG_ASSET_ID"

          # Fetch official GitHub asset metadata.
          curl -fLsS \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_API" \
            -o "$METADATA"

          # Confirm that the asset ID identifies the expected archive.
          python3 - "$METADATA" "$CLANG_RELEASE" <<'PY'
          import json
          import sys

          path, release = sys.argv[1:3]

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          expected = f"neutron-clang-{release}.tar.zst"

          if data.get("name") != expected:
              raise SystemExit(
                  f"ERROR: Unexpected asset name: {data.get('name')}"
              )

          if data.get("state") != "uploaded":
              raise SystemExit("ERROR: GitHub asset is not uploaded.")

          print("Asset:", data["name"])
          print("Size:", data.get("size"))
          print("GitHub digest:", data.get("digest"))
          PY

          # Download the exact release asset.
          echo "Downloading Neutron Clang archive..."

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --retry-all-errors \
            "$ASSET_URL" \
            -o "$ARCHIVE"

          test -s "$ARCHIVE"

          echo "Downloaded archive:"
          ls -lh "$ARCHIVE"

          # Read the upstream digest.
          UPSTREAM_DIGEST="$(
            python3 - "$METADATA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          digest = data.get("digest") or ""

          if digest.startswith("sha256:"):
              digest = digest[7:]

          print(digest)
          PY
          )"

          EXPECTED_DIGEST="${CLANG_SHA256:-$UPSTREAM_DIGEST}"

          # Validate SHA256 only when a proper 64-character
          # digest is available.
          if [[ "$EXPECTED_DIGEST" =~ ^[a-fA-F0-9]{64}$ ]]; then

            ACTUAL_DIGEST="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

            echo "Expected SHA256: $EXPECTED_DIGEST"
            echo "Actual SHA256:   $ACTUAL_DIGEST"

            if [ "${ACTUAL_DIGEST,,}" != "${EXPECTED_DIGEST,,}" ]; then
              echo "ERROR: Neutron Clang SHA256 mismatch."
              exit 1
            fi

            echo "PASS: SHA256 verified."

          else

            echo "::warning::Upstream Neutron Clang SHA256 metadata is malformed. Cryptographic checksum verification is unavailable for this release."

            echo "Upstream digest: $UPSTREAM_DIGEST"
            echo "Digest length: ${#UPSTREAM_DIGEST}"

            echo "Using Zstandard archive integrity verification."

          fi

          # Verify archive structure and compressed-frame integrity.
          echo "Testing Zstandard archive..."

          zstd -t "$ARCHIVE"

          echo "PASS: Zstandard archive integrity test."

          # Extract only after archive validation.
          echo "Extracting Neutron Clang..."

          tar --zstd -xf "$ARCHIVE" -C "$TOOLCHAIN_DIR"

          if [ ! -x "$TOOLCHAIN_DIR/bin/clang" ]; then
            echo "ERROR: Clang executable not found."
            find "$TOOLCHAIN_DIR" -maxdepth 5 -name clang -print
            exit 1
          fi

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          echo "Installed Clang:"
          "$TOOLCHAIN_DIR/bin/clang" --version

          echo "PASS: Neutron Clang installed."

      # --------------------------------------------------
      # 4. INTEGRATE PINNED BAKASU
      # --------------------------------------------------

      - name: Integrate pinned BakaSU
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          SETUP_SCRIPT="$RUNNER_TEMP/bakasu-setup.sh"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "$SETUP_SCRIPT"

          sh -n "$SETUP_SCRIPT"

          echo "Integrating BakaSU commit: $BAKASU_COMMIT"

          sh "$SETUP_SCRIPT" "$BAKASU_COMMIT"

          test -d KernelSU/.git
          test -L drivers/kernelsu
          test -d drivers/kernelsu

          ACTUAL="$(git -C KernelSU rev-parse HEAD)"

          echo "Expected BakaSU: $BAKASU_COMMIT"
          echo "Actual BakaSU:   $ACTUAL"

          test "$ACTUAL" = "$BAKASU_COMMIT"

          grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          test -f drivers/kernelsu/tools/manual_hook_check.mk

          grep -Fq \
            'include $(KSU_SRC)/tools/manual_hook_check.mk' \
            drivers/kernelsu/Kbuild

          echo "PASS: Pinned BakaSU integration verified."

      # --------------------------------------------------
      # 5. GENERATE SWEET CONFIGURATION
      # --------------------------------------------------

      - name: Generate Sweet configuration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p out artifacts

          MAKE_ARGS=(
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "Generating sweet_defconfig..."

          make O=out "${MAKE_ARGS[@]}" sweet_defconfig

          echo "Running olddefconfig..."

          make O=out "${MAKE_ARGS[@]}" olddefconfig

          CONFIG="out/.config"

          test -s "$CONFIG"

          cp "$CONFIG" artifacts/generated-sweet.config

          echo "PASS: Sweet configuration generated."

      # --------------------------------------------------
      # 6. VALIDATE BAKASU CONFIGURATION
      # --------------------------------------------------

      - name: Validate BakaSU configuration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          test -s "$CONFIG"

          require_enabled() {
            local option="$1"

            if grep -qx "${option}=y" "$CONFIG"; then
              echo "PASS: ${option}=y"
            else
              echo "FAIL: ${option} is not enabled."
              exit 1
            fi
          }

          for OPTION in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_DEBUG_KERNEL \
            CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK
          do
            require_enabled "$OPTION"
          done

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "FAIL: Tracepoint hook selected."
            exit 1
          fi

          if grep -qx 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "FAIL: Unexpected SUSFS configuration."
            exit 1
          fi

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_MANUAL_HOOK_AUTO_)' \
            "$CONFIG" \
            | tee artifacts/bakasu-config-summary.txt

          echo "PASS: BakaSU configuration validated."

      # --------------------------------------------------
      # 7. VALIDATE DROIDSPACES STAGE 1 + STAGE 2
      # --------------------------------------------------

      - name: Validate DroidSpaces Stage 1 and Stage 2 configuration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          CONFIG="out/.config"
          SUMMARY="artifacts/droidspaces-config-summary.txt"

          test -s "$CONFIG"
          mkdir -p artifacts

          require_enabled() {
            local option="$1"

            if grep -qx "${option}=y" "$CONFIG"; then
              echo "PASS: ${option}=y"
            else
              echo "FAIL: ${option} is not enabled after olddefconfig."
              exit 1
            fi
          }

          {
            echo "MR MATRIX - DroidSpaces Configuration"
            echo "======================================"
            echo
            echo "[Stage 1 - Core namespaces]"

            for OPTION in \
              CONFIG_NAMESPACES \
              CONFIG_UTS_NS \
              CONFIG_PID_NS \
              CONFIG_SYSVIPC \
              CONFIG_IPC_NS
            do
              require_enabled "$OPTION"
              grep -x "${OPTION}=y" "$CONFIG"
            done

            echo
            echo "[Stage 2 - User namespace and device support]"

            for OPTION in \
              CONFIG_USER_NS \
              CONFIG_DEVTMPFS \
              CONFIG_CGROUPS \
              CONFIG_CGROUP_DEVICE \
              CONFIG_SYSCTL \
              CONFIG_POSIX_MQUEUE
            do
              require_enabled "$OPTION"
              grep -x "${OPTION}=y" "$CONFIG"
            done

          } | tee "$SUMMARY"

          echo "PASS: DroidSpaces Stage 1 + Stage 2 validated."

      # --------------------------------------------------
      # 8. OFFICIAL BAKASU MANUAL-HOOK CHECKER
      # --------------------------------------------------

      - name: Verify official BakaSU manual hooks
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          CHECKER="drivers/kernelsu/tools/manual_hook_check.mk"
          CHECK_MK="$RUNNER_TEMP/matrix-check.mk"
          CONFIG="$PWD/out/.config"

          test -f "$CHECKER"
          test -s "$CONFIG"

          KERNEL_VERSION="$(make -s kernelversion)"

          VERSION_MAJOR="${KERNEL_VERSION%%.*}"
          VERSION_REST="${KERNEL_VERSION#*.}"
          VERSION_MINOR="${VERSION_REST%%.*}"

          echo "Kernel version: $KERNEL_VERSION"

          {
            printf '%s\n' 'include $(KSU_CONFIG_FILE)'
            printf '%s\n' 'include $(KSU_CHECKER_FILE)'
            printf '\n'
            printf '%s\n' '.DEFAULT_GOAL := check'
            printf '\n'
            printf '%s\n' '.PHONY: check'
            printf '%s\n' 'check:'
            printf '\t%s\n' '@echo "PASS: Official BakaSU manual-hook checker"'
          } > "$CHECK_MK"

          set -o pipefail

          make --no-print-directory \
            -f "$CHECK_MK" \
            srctree="$PWD" \
            VERSION="$VERSION_MAJOR" \
            PATCHLEVEL="$VERSION_MINOR" \
            REPO_NAME="BakaSU" \
            KSU_CONFIG_FILE="$CONFIG" \
            KSU_CHECKER_FILE="$PWD/$CHECKER" \
            check \
            2>&1 | tee artifacts/manual-hook-check.log

          echo "PASS: BakaSU manual-hook validation."

      # --------------------------------------------------
      # 9. VERIFY TOOLCHAIN
      # --------------------------------------------------

      - name: Verify compiler and linkers
        shell: bash
        run: |
          set -euo pipefail

          echo "Clang:"
          command -v clang
          clang --version

          echo "ARM64 linker:"
          command -v aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version

          echo "ARM32 compatibility linker:"
          command -v arm-linux-gnueabi-ld
          arm-linux-gnueabi-ld --version

          echo "PASS: Toolchain validation."

      # --------------------------------------------------
      # 10. COMPILE IMAGE.GZ ONLY
      # --------------------------------------------------

      - name: Compile Sweet Image.gz
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p artifacts

          MAKE_ARGS=(
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "Kernel version:"
          make -s kernelversion

          echo "Starting Image.gz compilation..."

          set -o pipefail

          make -j"$(nproc)" \
            O=out \
            "${MAKE_ARGS[@]}" \
            Image.gz \
            2>&1 | tee artifacts/build.log

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Image.gz was not generated."
            exit 1
          fi

          cp "$IMAGE" artifacts/Image.gz

          sha256sum artifacts/Image.gz \
            > artifacts/Image.gz.sha256

          echo "Generated kernel image:"
          ls -lh artifacts/Image.gz

          echo "PASS: Image.gz compilation completed."

      # --------------------------------------------------
      # 11. RECORD BUILD INFORMATION
      # --------------------------------------------------

      - name: Record build information
        if: always()
        shell: bash
        working-directory: kernel
        run: |
          mkdir -p artifacts

          {
            echo "MR MATRIX - Sweet DroidSpaces Stage 1 + 2 BakaSU Image.gz"
            echo "Repository: $KERNEL_REPO"
            echo "Branch: $KERNEL_BRANCH"
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "BakaSU commit: $BAKASU_COMMIT"
            echo "Clang release: $CLANG_RELEASE"
            echo "DroidSpaces: Stage 1 + Stage 2"
            echo "Build result: ${{ job.status }}"

            echo
            echo "Kernel version:"
            make -s kernelversion 2>/dev/null || true

            echo
            echo "Configuration file:"
            if [ -s out/.config ]; then
              echo "Generated successfully."
            else
              echo "Not generated."
            fi

            echo
            echo "Image.gz:"
            if [ -s artifacts/Image.gz ]; then
              ls -lh artifacts/Image.gz
              sha256sum artifacts/Image.gz
            else
              echo "Image.gz not generated."
            fi

          } > artifacts/build-info.txt

      # --------------------------------------------------
      # 12. UPLOAD ARTIFACTS
      # --------------------------------------------------

      - name: Upload Image.gz build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-Sweet-DroidSpaces-Stage1-Stage2-BakaSU-Image.gz
          path: kernel/artifacts/
          if-no-files-found: warn
          retention-days: 14
