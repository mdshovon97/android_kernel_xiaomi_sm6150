
name: MR MATRIX - Sweet BakaSU Integration Validation

on:
  workflow_dispatch:

  push:
    branches:
      - matrix-bakasu-test
    paths:
      - '.github/workflows/matrix-bakasu-test.yml'
      - 'arch/arm64/configs/sweet_defconfig'
      - 'drivers/**'
      - 'fs/**'
      - 'kernel/**'
      - 'security/selinux/**'

permissions:
  contents: read

concurrency:
  group: matrix-bakasu-test-validation
  cancel-in-progress: false

jobs:
  bakasu-validation:
    name: Validate BakaSU (sweet / Linux 4.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout matrix-bakasu-test
        uses: actions/checkout@v4
        with:
          ref: matrix-bakasu-test
          fetch-depth: 1

      - name: Install configuration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            python3

      - name: Verify Sweet defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/sweet_defconfig"

          test -f "$DEFCONFIG"

          grep -n '^CONFIG_KSU=y$' "$DEFCONFIG"
          grep -n '^CONFIG_KSU_MANUAL_HOOK=y$' "$DEFCONFIG"
          grep -n '^CONFIG_KALLSYMS_ALL=y$' "$DEFCONFIG"

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$DEFCONFIG"; then
            echo "ERROR: Tracepoint hook must not be enabled for Linux 4.14."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_SUSFS=y$' "$DEFCONFIG"; then
            echo "ERROR: SUSFS is outside this phase."
            exit 1
          fi

          if [ -e arch/arm64/configs/matrix_bakasu.config ]; then
            echo "ERROR: Obsolete matrix_bakasu.config still exists."
            exit 1
          fi

          echo "Sweet defconfig source checks: PASS"

      - name: Download pinned BakaSU setup script
        shell: bash
        run: |
          set -euo pipefail

          BAKASU_COMMIT="516d3e87fbc986ccefdde2c2765f1700612441a9"

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "$RUNNER_TEMP/bakasu-setup.sh"

          test -s "$RUNNER_TEMP/bakasu-setup.sh"

          echo "$BAKASU_COMMIT" > bakasu-commit.txt

      - name: Integrate pinned BakaSU driver
        shell: bash
        run: |
          set -euo pipefail

          BAKASU_COMMIT="516d3e87fbc986ccefdde2c2765f1700612441a9"

          sh "$RUNNER_TEMP/bakasu-setup.sh" "$BAKASU_COMMIT"

          ACTUAL="$(git -C KernelSU rev-parse HEAD)"

          echo "Expected: $BAKASU_COMMIT"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BAKASU_COMMIT"

          test -L drivers/kernelsu
          test -d drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "Pinned BakaSU driver integration: PASS"

      - name: Generate configuration from sweet_defconfig
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          make O=out ARCH=arm64 sweet_defconfig
          make O=out ARCH=arm64 olddefconfig

          CONFIG="out/.config"

          test -s "$CONFIG"

          require_config() {
            if ! grep -qx "$1=y" "$CONFIG"; then
              echo "ERROR: Expected $1=y in generated configuration."
              exit 1
            fi
            echo "PASS: $1=y"
          }

          require_config CONFIG_KSU
          require_config CONFIG_KSU_MANUAL_HOOK
          require_config CONFIG_KALLSYMS_ALL
          require_config CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          require_config CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          require_config CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$CONFIG"; then
            echo "ERROR: Tracepoint hook selected."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_SUSFS=y$' "$CONFIG"; then
            echo "ERROR: SUSFS selected unexpectedly."
            exit 1
          fi

          cp "$CONFIG" artifacts/generated-sweet.config

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_MANUAL_HOOK_AUTO_)' \
            "$CONFIG" | tee artifacts/bakasu-config-summary.txt

          echo "Generated Sweet configuration: PASS"

      - name: Run official BakaSU manual hook checker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          {
            echo "=========================================="
            echo "MR MATRIX - OFFICIAL BAKASU HOOK CHECK"
            echo "=========================================="

            echo "Kernel version:"
            make O=out ARCH=arm64 kernelversion

            echo
            echo "BakaSU revision:"
            git -C KernelSU rev-parse HEAD

            echo
            echo "Generated configuration:"
            grep -E \
              '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_MANUAL_HOOK_AUTO_)' \
              out/.config

            echo
            echo "Invoking BakaSU Kbuild manual-hook checker..."

            make O=out ARCH=arm64 V=1 -n drivers/kernelsu/

            echo
            echo "Official BakaSU manual-hook checker: PASS"

          } 2>&1 | tee artifacts/official-manual-hook-check.txt

      - name: Verify incompatible hooks are absent
        shell: bash
        run: |
          set -euo pipefail

          if grep -nF 'ksu_vfs_read_hook' fs/read_write.c; then
            echo "ERROR: Incompatible ksu_vfs_read_hook found."
            exit 1
          fi

          if grep -nF 'is_ksu_transition' security/selinux/hooks.c; then
            echo "ERROR: Incompatible is_ksu_transition found."
            exit 1
          fi

          if grep -nF 'ksu_handle_rename' security/security.c; then
            echo "ERROR: Incompatible ksu_handle_rename found."
            exit 1
          fi

          echo "Incompatible hook checks: PASS"

      - name: Record source audit
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: matrix-bakasu-test"
            echo "Source commit: $GITHUB_SHA"
            echo "BakaSU expected commit: 516d3e87fbc986ccefdde2c2765f1700612441a9"

            echo
            echo "Kernel version:"
            make kernelversion || true

            echo
            echo "Working tree:"
            git status --short

            echo
            echo "Driver symlink:"
            readlink drivers/kernelsu || true

          } > artifacts/source-audit.txt

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-sweet-bakasu-validation
          path: |
            artifacts/
            bakasu-commit.txt
          if-no-files-found: warn
          retention-days: 14
