
name: MR MATRIX - Sweet BakaSU Integration Validation

on:
  workflow_dispatch:

  push:
    branches:
      - matrix-bakasu-test
    paths:
      - '.github/workflows/matrix-bakasu-test.yml'
      - 'arch/arm64/configs/sweet_defconfig'
      - 'drivers/**'
      - 'fs/**'
      - 'kernel/**'
      - 'security/selinux/**'

permissions:
  contents: read

concurrency:
  group: matrix-bakasu-test-validation
  cancel-in-progress: false

jobs:
  bakasu-validation:
    name: Validate BakaSU - Sweet Linux 4.14
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      ARCH: arm64
      BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9

    steps:
      # --------------------------------------------
      # 1. CHECKOUT KERNEL SOURCE
      # --------------------------------------------
      - name: Checkout matrix-bakasu-test
        uses: actions/checkout@v4
        with:
          ref: matrix-bakasu-test
          fetch-depth: 1

      # --------------------------------------------
      # 2. INSTALL CONFIGURATION DEPENDENCIES
      # --------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            python3 \
            git \
            curl

      # --------------------------------------------
      # 3. VERIFY SWEET DEFCONFIG
      # --------------------------------------------
      - name: Verify Sweet defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/sweet_defconfig"

          test -s "$DEFCONFIG"

          for OPTION in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KALLSYMS_ALL
          do
            grep -qx "${OPTION}=y" "$DEFCONFIG"
            echo "PASS: ${OPTION}=y"
          done

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$DEFCONFIG"; then
            echo "FAIL: Tracepoint hook is incompatible."
            exit 1
          fi

          if grep -qx 'CONFIG_KSU_SUSFS=y' "$DEFCONFIG"; then
            echo "FAIL: SUSFS is not part of Phase 1."
            exit 1
          fi

          if [ -e arch/arm64/configs/matrix_bakasu.config ]; then
            echo "FAIL: Obsolete config fragment exists."
            exit 1
          fi

          echo "PASS: Sweet defconfig verified."

      # --------------------------------------------
      # 4. DOWNLOAD PINNED BAKASU SETUP
      # --------------------------------------------
      - name: Download pinned BakaSU setup
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "$RUNNER_TEMP/bakasu-setup.sh"

          test -s "$RUNNER_TEMP/bakasu-setup.sh"

          echo "$BAKASU_COMMIT" > bakasu-commit.txt

          echo "PASS: Pinned setup downloaded."

      # --------------------------------------------
      # 5. INTEGRATE BAKASU DRIVER
      # --------------------------------------------
      - name: Integrate pinned BakaSU
        shell: bash
        run: |
          set -euo pipefail

          sh "$RUNNER_TEMP/bakasu-setup.sh" "$BAKASU_COMMIT"

          ACTUAL="$(git -C KernelSU rev-parse HEAD)"

          echo "Expected: $BAKASU_COMMIT"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BAKASU_COMMIT"

          test -L drivers/kernelsu
          test -d drivers/kernelsu

          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/tools/manual_hook_check.mk

          grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo "PASS: BakaSU driver integrated."

      # --------------------------------------------
      # 6. GENERATE SWEET KERNEL CONFIGURATION
      # --------------------------------------------
      - name: Generate Sweet configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          make O=out ARCH=arm64 sweet_defconfig
          make O=out ARCH=arm64 olddefconfig

          CONFIG="out/.config"

          test -s "$CONFIG"

          cp "$CONFIG" artifacts/generated-sweet.config

          echo "PASS: Generated kernel configuration."

      # --------------------------------------------
      # 7. VALIDATE GENERATED CONFIGURATION
      # --------------------------------------------
      - name: Validate BakaSU configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          require_enabled() {
            local option="$1"

            if grep -qx "${option}=y" "$CONFIG"; then
              echo "PASS: ${option}=y"
            else
              echo "FAIL: ${option} is not enabled."
              exit 1
            fi
          }

          require_enabled CONFIG_KSU
          require_enabled CONFIG_KSU_MANUAL_HOOK
          require_enabled CONFIG_KALLSYMS
          require_enabled CONFIG_KALLSYMS_ALL

          require_enabled CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          require_enabled CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          require_enabled CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "FAIL: Tracepoint hook selected."
            exit 1
          fi

          if grep -qx 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "FAIL: SUSFS selected."
            exit 1
          fi

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_MANUAL_HOOK_AUTO_)' \
            "$CONFIG" \
            | tee artifacts/bakasu-config-summary.txt

          echo "PASS: BakaSU configuration verified."

      # --------------------------------------------
      # 8. RUN OFFICIAL BAKASU MANUAL HOOK CHECKER
      # --------------------------------------------
      - name: Run official BakaSU manual hook checker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          CHECKER="drivers/kernelsu/tools/manual_hook_check.mk"
          KBUILD="drivers/kernelsu/Kbuild"
          CONFIG="$PWD/out/.config"
          CHECK_MK="$RUNNER_TEMP/matrix-bakasu-check.mk"

          test -f "$CHECKER"
          test -f "$KBUILD"
          test -s "$CONFIG"

          grep -Fq \
            'include $(KSU_SRC)/tools/manual_hook_check.mk' \
            "$KBUILD"

          KERNEL_VERSION="$(make -s kernelversion)"

          VERSION_MAJOR="${KERNEL_VERSION%%.*}"
          VERSION_REST="${KERNEL_VERSION#*.}"
          VERSION_MINOR="${VERSION_REST%%.*}"

          echo "Kernel: $KERNEL_VERSION"
          echo "BakaSU: $BAKASU_COMMIT"

          # Create a temporary Makefile that evaluates
          # the actual pinned BakaSU checker with the
          # generated kernel configuration.
          cat > "$CHECK_MK" <<'EOF'
          include $(KSU_CONFIG_FILE)
          include $(KSU_CHECKER_FILE)

          .PHONY: check
          check:
          	@echo "PASS: Official BakaSU manual hook checker"
          EOF

          {
            echo "======================================"
            echo "MR MATRIX - OFFICIAL BAKASU CHECK"
            echo "======================================"

            make --no-print-directory \
              -f "$CHECK_MK" \
              srctree="$PWD" \
              VERSION="$VERSION_MAJOR" \
              PATCHLEVEL="$VERSION_MINOR" \
              REPO_NAME="BakaSU" \
              KSU_CONFIG_FILE="$CONFIG" \
              KSU_CHECKER_FILE="$PWD/$CHECKER" \
              check

          } 2>&1 | tee artifacts/official-manual-hook-check.txt

      # --------------------------------------------
      # 9. ADDITIONAL INCOMPATIBLE HOOK CHECKS
      # --------------------------------------------
      - name: Check incompatible hooks
        shell: bash
        run: |
          set -euo pipefail

          check_absent() {
            local symbol="$1"
            local file="$2"

            if grep -nFw -- "$symbol" "$file"; then
              echo "FAIL: Incompatible hook $symbol"
              exit 1
            fi

            echo "PASS: $symbol absent from $file"
          }

          check_absent \
            ksu_vfs_read_hook \
            fs/read_write.c

          check_absent \
            is_ksu_transition \
            security/selinux/hooks.c

          check_absent \
            ksu_handle_rename \
            security/security.c

          check_absent \
            ksu_handle_execve \
            fs/exec.c

          check_absent \
            ksu_handle_post_execve \
            fs/exec.c

          echo "PASS: No incompatible hooks found."

      # --------------------------------------------
      # 10. RECORD SOURCE AND DRIVER INFORMATION
      # --------------------------------------------
      - name: Record validation information
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          {
            echo "MR MATRIX - BakaSU Validation"
            echo "============================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: matrix-bakasu-test"
            echo "Source commit: $GITHUB_SHA"
            echo "Expected BakaSU: $BAKASU_COMMIT"

            echo
            echo "Kernel version:"
            make -s kernelversion || true

            echo
            echo "Actual BakaSU revision:"
            if [ -d KernelSU/.git ]; then
              git -C KernelSU rev-parse HEAD
            else
              echo "Not integrated"
            fi

            echo
            echo "Driver symlink:"
            readlink drivers/kernelsu || true

            echo
            echo "Source changes:"
            git status --short

          } > artifacts/source-audit.txt

          git diff -- \
            drivers/Makefile \
            drivers/Kconfig \
            > artifacts/driver-integration.diff || true

      # --------------------------------------------
      # 11. UPLOAD VALIDATION REPORT
      # --------------------------------------------
      - name: Upload BakaSU validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-sweet-bakasu-validation
          path: |
            artifacts/
            bakasu-commit.txt
          if-no-files-found: warn
          retention-days: 14
