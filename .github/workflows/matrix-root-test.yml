
name: MR MATRIX - Sweet Baseline Kernel Build

on:
  workflow_dispatch:

  push:
    branches:
      - matrix-root-test

permissions:
  contents: read

concurrency:
  group: matrix-root-test-baseline
  cancel-in-progress: false

jobs:
  baseline-build:
    name: Build sweet (ARM64 / Linux 4.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT SOURCE
      # --------------------------------------------------
      - name: Checkout matrix-root-test
        uses: actions/checkout@v4
        with:
          ref: matrix-root-test
          fetch-depth: 1

      # --------------------------------------------------
      # 2. RECORD SOURCE INFORMATION
      # --------------------------------------------------
      - name: Record source information
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "========================================"
          echo "MR MATRIX - BASELINE BUILD"
          echo "========================================"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          echo
          echo "Kernel version:"
          head -n 5 Makefile

          echo
          echo "Source status:"
          git status --short

          git rev-parse HEAD > artifacts/source-commit.txt
          echo "$GITHUB_REF_NAME" > artifacts/source-branch.txt

          git log -1 --format=fuller \
            > artifacts/source-commit-details.txt

      # --------------------------------------------------
      # 3. INSTALL BUILD DEPENDENCIES
      # --------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            python-is-python3 \
            perl \
            make \
            git \
            curl \
            jq \
            zstd \
            unzip \
            zip \
            rsync \
            device-tree-compiler \
            lz4 \
            gzip \
            xz-utils

      # --------------------------------------------------
      # 4. VALIDATE BUILD HOST
      # --------------------------------------------------
      - name: Validate build host
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "MR MATRIX BUILD HOST"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "GLIBC version:"
          getconf GNU_LIBC_VERSION

          echo
          echo "GCC version:"
          gcc --version | head -n 1

          echo
          echo "Make version:"
          make --version | head -n 1

          GLIBC_VERSION="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"

          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n 1)" != "2.38" ]; then
            echo "ERROR: Host GLIBC is older than 2.38."
            exit 1
          fi

          echo
          echo "SUCCESS: Build host compatibility check passed."

      # --------------------------------------------------
      # 5. DOWNLOAD AND VALIDATE NEUTRON CLANG
      # --------------------------------------------------
      - name: Download Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest"

          ROOT="$RUNNER_TEMP/neutron-clang"
          ARCHIVE="$RUNNER_TEMP/neutron-clang.tar.zst"

          echo "Fetching latest Neutron Clang release..."

          RELEASE_JSON="$(curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            "$API")"

          RELEASE_TAG="$(echo "$RELEASE_JSON" | jq -r '.tag_name // "unknown"')"

          URL="$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url // empty')"

          if [ -z "$URL" ]; then
            echo "ERROR: No .tar.zst Clang archive found."

            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'

            exit 1
          fi

          echo "Release: $RELEASE_TAG"
          echo "Selected archive: $URL"

          mkdir -p "$ROOT"

          echo "Downloading Neutron Clang..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            -o "$ARCHIVE"

          echo "Validating archive..."

          zstd -t "$ARCHIVE"

          echo "Extracting Clang..."

          tar --zstd -xf "$ARCHIVE" -C "$ROOT"

          echo "Searching for Clang executable..."

          CLANG_PATH=""

          # Search for the standard clang executable.
          while IFS= read -r -d '' FILE; do
            if [ -x "$FILE" ]; then
              CLANG_PATH="$FILE"
              break
            fi
          done < <(
            find "$ROOT" \
              \( -type f -o -type l \) \
              -name clang \
              -print0
          )

          # Fallback for versioned Clang executables.
          if [ -z "$CLANG_PATH" ]; then
            while IFS= read -r -d '' FILE; do
              if [ -x "$FILE" ]; then
                CLANG_PATH="$FILE"
                break
              fi
            done < <(
              find "$ROOT" \
                \( -type f -o -type l \) \
                -name 'clang-[0-9]*' \
                -print0
            )
          fi

          if [ -z "$CLANG_PATH" ]; then
            echo "ERROR: Executable Clang binary not found."

            echo "Extracted archive contents:"
            find "$ROOT" -maxdepth 5 -print

            exit 1
          fi

          CLANG_BIN="$(dirname "$CLANG_PATH")"

          # Create clang symlink if only a versioned binary exists.
          if [ "$(basename "$CLANG_PATH")" != "clang" ]; then
            ln -sf "$(basename "$CLANG_PATH")" \
              "$CLANG_BIN/clang"
          fi

          if [ ! -x "$CLANG_BIN/clang" ]; then
            echo "ERROR: Clang executable validation failed."
            exit 1
          fi

          # Validate required LLVM executables.
          REQUIRED_TOOLS=(
            clang
            ld.lld
            llvm-ar
            llvm-nm
            llvm-objcopy
            llvm-objdump
            llvm-readelf
            llvm-strip
          )

          for TOOL in "${REQUIRED_TOOLS[@]}"; do
            if [ ! -x "$CLANG_BIN/$TOOL" ]; then
              echo "ERROR: Required LLVM tool missing: $TOOL"

              find "$ROOT" -name "$TOOL*" -print

              exit 1
            fi
          done

          # Add toolchain to subsequent workflow steps.
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "========================================"
          echo "NEUTRON CLANG VALIDATION"
          echo "========================================"

          echo "Release: $RELEASE_TAG"
          echo "Clang directory: $CLANG_BIN"
          echo "Clang executable: $CLANG_PATH"

          echo
          echo "Clang version:"
          "$CLANG_BIN/clang" --version

          echo
          echo "LLD version:"
          "$CLANG_BIN/ld.lld" --version

          echo
          echo "LLVM tools:"
          for TOOL in "${REQUIRED_TOOLS[@]}"; do
            echo "OK: $TOOL"
          done

          echo
          echo "Clang shared-library dependencies:"
          ldd "$CLANG_BIN/clang"

          if ldd "$CLANG_BIN/clang" | grep -q "not found"; then
            echo "ERROR: Clang has unresolved shared libraries."
            exit 1
          fi

          echo "SUCCESS: Neutron Clang is ready."

          echo "$RELEASE_TAG" > artifacts/clang-release.txt
          echo "$CLANG_BIN" > artifacts/clang-directory.txt

          "$CLANG_BIN/clang" --version \
            > artifacts/clang-version.txt

          "$CLANG_BIN/ld.lld" --version \
            > artifacts/lld-version.txt

      # --------------------------------------------------
      # 6. VALIDATE SWEET SOURCE AND DEFCONFIG
      # --------------------------------------------------
      - name: Validate sweet defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/sweet_defconfig"

          echo "========================================"
          echo "SWEET SOURCE VALIDATION"
          echo "========================================"

          if [ ! -f Makefile ]; then
            echo "ERROR: Kernel Makefile missing."
            exit 1
          fi

          if [ ! -f arch/arm64/Makefile ]; then
            echo "ERROR: ARM64 Makefile missing."
            exit 1
          fi

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: Missing $DEFCONFIG"
            exit 1
          fi

          echo "Kernel version:"
          make kernelversion

          echo
          echo "Defconfig:"
          echo "$DEFCONFIG"

          echo
          echo "Defconfig line count:"
          wc -l "$DEFCONFIG"

          sha256sum "$DEFCONFIG" \
            > artifacts/defconfig.sha256

          wc -l "$DEFCONFIG" \
            > artifacts/defconfig-lines.txt

          echo
          echo "SUCCESS: Sweet source validation passed."

      # --------------------------------------------------
      # 7. GENERATE BASELINE CONFIGURATION
      # --------------------------------------------------
      - name: Generate baseline configuration
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out artifacts

          echo "========================================"
          echo "GENERATING SWEET CONFIGURATION"
          echo "========================================"

          echo "Compiler: Neutron Clang"
          echo "LLVM mode: enabled"
          echo "Integrated assembler: enabled"
          echo "Architecture: ARM64"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            sweet_defconfig

          echo
          echo "Generating olddefconfig..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          if [ ! -s out/.config ]; then
            echo "ERROR: Kernel configuration was not generated."
            exit 1
          fi

          cp out/.config artifacts/baseline.config

          sha256sum out/.config \
            > artifacts/baseline-config.sha256

          echo
          echo "Configuration line count:"
          wc -l out/.config

          echo
          echo "SUCCESS: Baseline configuration generated."

      # --------------------------------------------------
      # 8. COMPILE BASELINE KERNEL
      # --------------------------------------------------
      - name: Compile baseline kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          JOBS="$(nproc)"

          echo "========================================"
          echo "MR MATRIX BASELINE COMPILATION"
          echo "========================================"

          echo "Target: Xiaomi sweet"
          echo "Architecture: ARM64"
          echo "Kernel generation: Linux 4.14"
          echo "Compiler: Neutron Clang"
          echo "Linker: LLD"
          echo "LLVM: enabled"
          echo "Integrated assembler: enabled"
          echo "Build jobs: $JOBS"

          echo
          echo "Starting kernel compilation..."

          set -o pipefail

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee artifacts/build.log

          echo
          echo "SUCCESS: Kernel compilation completed."

      # --------------------------------------------------
      # 9. VALIDATE AND COLLECT KERNEL OUTPUT
      # --------------------------------------------------
      - name: Validate kernel output
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="out/arch/arm64/boot"

          mkdir -p artifacts/kernel-output

          echo "========================================"
          echo "KERNEL OUTPUT VALIDATION"
          echo "========================================"

          if [ ! -d "$BOOT_DIR" ]; then
            echo "ERROR: ARM64 boot output directory missing."
            exit 1
          fi

          IMAGE=""

          for NAME in \
            Image.gz-dtb \
            Image-dtb \
            Image.gz \
            Image
          do
            if [ -s "$BOOT_DIR/$NAME" ]; then
              IMAGE="$BOOT_DIR/$NAME"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "ERROR: No valid ARM64 kernel image found."

            find "$BOOT_DIR" \
              -maxdepth 3 \
              -type f \
              -printf '%p (%s bytes)\n' || true

            exit 1
          fi

          echo "Kernel image found:"
          ls -lh "$IMAGE"

          cp "$IMAGE" artifacts/kernel-output/

          # Collect device tree and overlay images when present.
          for NAME in dtb.img dtbo.img; do
            if [ -s "$BOOT_DIR/$NAME" ]; then
              cp "$BOOT_DIR/$NAME" artifacts/kernel-output/
            fi
          done

          # Collect device tree source output.
          if [ -d "$BOOT_DIR/dts" ]; then
            tar -czf artifacts/kernel-output/dts.tar.gz \
              -C "$BOOT_DIR" dts
          fi

          # Collect standalone DTB files if generated.
          find "$BOOT_DIR" \
            -maxdepth 3 \
            -type f \
            -name '*.dtb' \
            -print \
            > artifacts/kernel-output/dtb-files.txt

          echo
          echo "Kernel output files:"
          ls -lh artifacts/kernel-output/

          echo
          echo "Image checksum:"
          sha256sum "artifacts/kernel-output/$(basename "$IMAGE")" \
            > artifacts/kernel-output/kernel-image.sha256

          echo
          echo "SUCCESS: Kernel output validated."

      # --------------------------------------------------
      # 10. UPLOAD BUILD ARTIFACTS
      # --------------------------------------------------
      - name: Upload baseline build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-sweet-baseline
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
