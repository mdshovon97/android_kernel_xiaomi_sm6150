
name: MR MATRIX - Sweet Baseline Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - matrix-root-test
    paths:
      - ".github/workflows/matrix-root-test.yml"

permissions:
  contents: read

concurrency:
  group: matrix-root-test-baseline
  cancel-in-progress: false

jobs:
  baseline-build:
    name: Build sweet (ARM64 / Linux 4.14)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout matrix-root-test
        uses: actions/checkout@v4
        with:
          ref: matrix-root-test
          fetch-depth: 1

      - name: Record source information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: matrix-root-test"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Kernel version:"
          head -n 5 Makefile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev \
            python3 python-is-python3 \
            perl make git curl jq \
            zstd unzip zip

      - name: Download Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest"

          URL=$(curl -fsSL "$API" | jq -r \
            '.assets[] | select(.name | endswith(".tar.zst")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: No Neutron Clang archive found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/neutron-clang"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/neutron-clang.tar.zst"

          tar --zstd -xf "$RUNNER_TEMP/neutron-clang.tar.zst" \
            -C "$RUNNER_TEMP/neutron-clang"

          CLANG_BIN=$(find "$RUNNER_TEMP/neutron-clang" \
            -type f -name clang -printf '%h\n' | head -n 1)

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: Clang executable not found."
            exit 1
          fi

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "Clang directory: $CLANG_BIN"
          "$CLANG_BIN/clang" --version

      - name: Validate sweet defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/sweet_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: Missing $DEFCONFIG"
            exit 1
          fi

          echo "Found sweet_defconfig"

          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum "$DEFCONFIG" > artifacts/defconfig.sha256

      - name: Generate baseline configuration
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            sweet_defconfig

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          cp out/.config artifacts/baseline.config

          echo "Baseline configuration generated."

      - name: Compile baseline kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          set -o pipefail

          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee artifacts/build.log

      - name: Validate kernel output
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Image.gz missing or empty."
            exit 1
          fi

          cp "$IMAGE" artifacts/Image.gz

          if [ -s out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img artifacts/
          fi

          echo "Kernel image successfully generated."
          ls -lh artifacts/

      - name: Upload baseline build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MR-MATRIX-sweet-baseline
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
